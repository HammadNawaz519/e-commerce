<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopy — Verify OTP</title>

  <!--=============== REMIXICONS ===============-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">

  <!--=============== CSS ===============-->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gsap-login.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='Images/chit_chat.png') }}">

  <style>
    /* Specific styles for OTP */
    .otp-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 2rem;
    }
    
    .otp-input {
      width: 50px;
      height: 55px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: #F9FAFB;
      font-size: 20px;
      text-align: center;
      font-weight: 700;
      outline: none;
      transition: 0.3s;
      color: var(--title-color);
    }
    
    .otp-input:focus {
      border-color: #1A1C23;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(26, 28, 35, 0.1);
    }

    .resend {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--small-font-size);
      color: var(--text-color);
      font-weight: 600;
    }

    .resend a {
      color: var(--title-color);
      text-decoration: none;
      font-weight: 700;
      transition: 0.3s;
    }

    .resend a:hover {
      color: var(--first-color);
    }

    .login__content {
      /* Re-center for verify if we want it single column, but let's keep the image for consistency */
    }

    @media (max-width: 850px) {
      .otp-input {
        width: 42px;
        height: 48px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <section class="login">
    <div class="login__content">
      <div>
        <h2 class="login__title" style="margin-bottom: 0.5rem;">Verify OTP</h2>
        <p style="text-align: center; font-size: 0.8rem; color: var(--text-color); margin-bottom: 2rem; font-weight: 600;">Enter the 6-digit code we sent to your email.</p>
        
        {% if request.args.get('error') %}
        <div class="form-error">{{ request.args.get('error') | e }}</div>
        {% endif %}

        <form method="POST" id="otpForm" autocomplete="off" class="login__form">
          <div class="otp-box">
            <input maxlength="1" class="otp-input" id="d1">
            <input maxlength="1" class="otp-input" id="d2">
            <input maxlength="1" class="otp-input" id="d3">
            <input maxlength="1" class="otp-input" id="d4">
            <input maxlength="1" class="otp-input" id="d5">
            <input maxlength="1" class="otp-input" id="d6">
          </div>
      
          <input type="hidden" name="otp" id="otpHidden">
      
          <button type="submit" class="login__button">
            VERIFY <i class="ri-shield-check-fill"></i>
          </button>
      
          <div class="resend">
            Didn't receive a code?
            <a href="#" id="resendLink">Resend</a>
            <span id="timer"></span>
          </div>
          <div id="resendMsg" style="margin-top:10px;font-size:12px;font-weight:700;color:var(--title-color);min-height:16px;text-align:center;"></div>
          <a href="/login" class="login__home"><i class="ri-arrow-left-line"></i> Back to Login</a>
        </form>
      </div>

      <div class="login__image">
        <img src="/static/uploads/images/Earbuds-Demo.webp" alt="Verify" class="login__img">
      </div>
    </div>
  </section>

  <!--=============== GSAP ===============-->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>

  <!--=============== MAIN JS ===============-->
  <script>
    const inputs = Array.from(document.querySelectorAll('.otp-input'));
    const hidden = document.getElementById('otpHidden');
    const form = document.getElementById('otpForm');
    const resendLink = document.getElementById('resendLink');
    const timerEl = document.getElementById('timer');
    const resendMsg = document.getElementById('resendMsg');
    let countdown = 0;

    inputs.forEach((el,i)=>{
      el.addEventListener('input',(e)=>{
        const val = e.target.value.replace(/\D/g,'').slice(0,1);
        e.target.value = val;
        if(val && i < inputs.length -1) inputs[i+1].focus();
      });
    });

    form.addEventListener('submit',(e)=>{
      const code = inputs.map(i=>i.value||'').join('');
      if(code.length !== 6){
        e.preventDefault();
        inputs[0].focus();
        return;
      }
      hidden.value = code;
    });

    function startTimer(sec){
      countdown = sec;
      updateTimer();
      const iv = setInterval(()=>{
        countdown--;
        updateTimer();
        if(countdown <= 0) clearInterval(iv);
      },1000);
    }

    function updateTimer(){
      if(countdown > 0){
        timerEl.textContent = ` (${countdown}s)`;
        resendLink.style.pointerEvents='none';
      } else {
        timerEl.textContent = '';
        resendLink.style.pointerEvents='auto';
      }
    }

    resendLink.addEventListener('click',(e)=>{
      e.preventDefault();
      if(countdown > 0) return;

      startTimer(45);
      resendMsg.textContent = '';
      fetch(location.pathname + '?resend=1', {method:'POST'})
        .then(r => r.json())
        .then(d => {
          if(d.success){
            resendMsg.textContent = d.message || 'Sent again. Type the new code.';
          } else {
            resendMsg.textContent = d.message || 'Could not resend right now.';
          }
        })
        .catch(()=>{
          resendMsg.textContent = 'Could not resend right now.';
        });
    });

    // Auto focus first input on load
    setTimeout(() => {
      inputs[0].focus();
    }, 1500);

    /*=============== GSAP ANIMATION ===============*/
    const tl = gsap.timeline({})

    tl.fromTo(
      '.login__content',
      { y: -800, scaleX: .2, scaleY: .5, opacity: 0 }, 
      { y: 0, scaleX: .2, scaleY: .5, opacity: 1, duration: 1.5, ease: 'power3.out' }
    )
    tl.to('.login__content', { scaleY: 1, duration: .6, ease: 'power3.out' }, '-=0.3')
    tl.to('.login__content', { scaleX: 1, duration: .7, ease: 'power3.out' }, '-=0.2')
    tl.to(
      '.login__img',
      { scale: 1.08, duration: 5, ease: 'power1.inOut', repeat: -1, yoyo: true, transformOrigin: 'center center' }
    )

    gsap.defaults({opacity: 0, y: -60, ease: 'power2.out', duration: 1.2})
    gsap.from('.login__title', {delay: 2.5})
    gsap.from('p', {delay: 2.6})
    gsap.from('.login__form', {delay: 2.7})
    gsap.from('.login__home', {delay: 2.8})
    gsap.from('.login__img', {y: 0, x: 100, delay: 3.2, ease: 'elastic.out(1,0.6)'})
  </script>
</body>
</html>
