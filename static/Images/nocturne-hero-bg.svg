<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" fill="none">
  <defs>
    <radialGradient id="spotlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1920 1140) rotate(90) scale(860 1080)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.23"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1920 1080) rotate(90) scale(1400 2300)">
      <stop offset="0.68" stop-color="#1A1C23" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E1015" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="blurText" x="600" y="560" width="2640" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurBokeh" x="-300" y="-300" width="4440" height="2760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="#1A1C23"/>

  <g filter="url(#blurBokeh)" opacity="0.58">
    <circle cx="410" cy="320" r="120" fill="#2F3440"/>
    <circle cx="1020" cy="270" r="78" fill="#2A2F39"/>
    <circle cx="3340" cy="380" r="140" fill="#343945"/>
    <circle cx="3550" cy="760" r="85" fill="#2F3440"/>
    <circle cx="500" cy="1710" r="155" fill="#2F3440"/>
    <circle cx="3350" cy="1770" r="170" fill="#313642"/>

    <rect x="260" y="660" width="190" height="190" rx="24" fill="#2C313C"/>
    <rect x="710" y="520" width="130" height="130" rx="18" fill="#2E3340"/>
    <rect x="3210" y="580" width="180" height="180" rx="24" fill="#2C313D"/>
    <rect x="3390" y="1120" width="120" height="120" rx="16" fill="#2F3440"/>
    <rect x="690" y="1440" width="170" height="170" rx="22" fill="#2E3340"/>
    <rect x="3070" y="1440" width="210" height="210" rx="28" fill="#2F3440"/>
  </g>

  <rect width="3840" height="2160" fill="url(#spotlight)"/>

  <g filter="url(#blurText)" opacity="0.46">
    <text x="1920" y="1200" text-anchor="middle" fill="#414754" font-family="Plus Jakarta Sans, Arial Black, sans-serif" font-size="500" font-weight="800" letter-spacing="20">NOCTURNE?</text>
  </g>

  <ellipse cx="1920" cy="1140" rx="620" ry="360" fill="#FFFFFF" opacity="0.035"/>
  <ellipse cx="1920" cy="1140" rx="450" ry="250" fill="#FFFFFF" opacity="0.035"/>

  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
